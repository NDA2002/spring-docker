apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: global-cors
  namespace: default
plugin: cors
config:
  origins:
    - "*"
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Content-Type
    - Authorization
  credentials: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-api-ingress
  namespace: default
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: "global-cors"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          # Route 1: React API Endpoint (/api/pod-info)
          - path: /api/pod-info
            pathType: Prefix
            backend:
              service:
                name: react-service
                port:
                  number: 80
          # Route 2: React Web Application (/)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-service
                port:
                  number: 80
