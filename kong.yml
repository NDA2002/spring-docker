_format_version: "3.0"

# Kong Services & Routes Configuration (DB-less mode)
services:
  # Route to Spring Boot Backend or Mock API
  - name: backend-service
    url: http://springboot-service:80
    routes:
      - name: hello-route
        paths:
          - /hello
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Content-Type
            - Authorization
          credentials: true

  # Route to Public JSONPlaceholder Mock API (for standalone testing)
  - name: mock-api-service
    url: https://jsonplaceholder.typicode.com
    routes:
      - name: mock-posts-route
        paths:
          - /api/posts
        strip_path: true
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - OPTIONS
